<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Phrasal Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      color: #ffffff;
      margin: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 12px 18px;
      border-radius: 16px;
      margin-top: env(safe-area-inset-top);
    }
    .verb-card {
      background: #ffffff;
      color: #1e1b4b;
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      margin: 16px 0;
    }
    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .verb-title {
      font-size: 34px;
      font-weight: 900;
      margin: 0;
      color: #1e1b4b;
      letter-spacing: -0.5px;
    }
    .example-box {
      background: #f8fafc;
      border-left: 4px solid #7c3aed;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
      color: #334155;
      text-align: left;
      display: none;
      line-height: 1.4;
    }
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    button.opt {
      background: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      border: none;
      border-radius: 18px;
      padding: 16px 12px;
      font-size: 14px;
      font-weight: 600;
      min-height: 115px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.12s ease, background-color 0.2s ease;
      line-height: 1.3;
      word-break: break-word;
    }
    button.opt:active {
      transform: scale(0.96);
    }
    button.opt.correct {
      background: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }
    button.opt.wrong {
      background: #ef4444 !important;
      color: #ffffff !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }
    .next-btn {
      background: #facc15;
      color: #1e1b4b;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      display: none;
      margin-bottom: env(safe-area-inset-bottom);
    }
    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="header">
    <span id="score">🎯 0 / 0</span>
    <span id="streak">🔥 0 di fila</span>
  </div>

  <div class="verb-card">
    <div class="badge">Phrasal Verb</div>
    <h1 class="verb-title" id="verb-text">Caricamento...</h1>
    <div class="example-box" id="example-box"></div>
  </div>

  <div>
    <div class="grid-2x2" id="options-container"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Prossimo →</button>
  </div>

  <script>
    let allVerbs = [];
    let currentVerb = null;
    let score = 0, total = 0, streak = 0;
    let answered = false;

    fetch('verbs.json')
      .then(res => res.json())
      .then(data => {
        allVerbs = data;
        nextQuestion();
      })
      .catch(() => {
        document.getElementById('verb-text').innerText = "Errore verbs.json";
      });

    function nextQuestion() {
      answered = false;
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('example-box').style.display = 'none';
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      // Pesca un phrasal verb casuale
      currentVerb = allVerbs[Math.floor(Math.random() * allVerbs.length)];
      document.getElementById('verb-text').innerText = currentVerb.verb;

      // Pesca 3 significati sbagliati diversi tra loro
      let choices = [currentVerb];
      while (choices.length < 4) {
        let rand = allVerbs[Math.floor(Math.random() * allVerbs.length)];
        if (!choices.some(c => c.meaning.toLowerCase() === rand.meaning.toLowerCase())) {
          choices.push(rand);
        }
      }

      // Mescola le 4 opzioni nella matrice 2x2
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = choice.meaning;
        btn.onclick = () => checkAnswer(btn, choice);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedBtn, choice) {
      if (answered) return;
      answered = true;
      total++;

      const isCorrect = choice.meaning === currentVerb.meaning;

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        score++;
        streak++;
      } else {
        selectedBtn.classList.add('wrong');
        streak = 0;
        // Mostra comunque quale era quella giusta in verde
        Array.from(document.getElementById('options-container').children).forEach(b => {
          if (b.innerText === currentVerb.meaning) {
            b.classList.add('correct');
          }
        });
      }

      document.getElementById('score').innerText = `🎯 ${score} / ${total}`;
      document.getElementById('streak').innerText = `🔥 ${streak} di fila`;

      if (currentVerb.example) {
        const exBox = document.getElementById('example-box');
        exBox.innerHTML = `<strong>Esempio:</strong><br><em>"${currentVerb.example}"</em>`;
        exBox.style.display = 'block';
      }

      document.getElementById('next-btn').style.display = 'block';
    }
  </script>
</body>
</html>
