<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phrasal Quiz">
  <link id="apple-icon" rel="apple-touch-icon">
  <title>Phrasal Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }
    .top-bar {
      margin-top: env(safe-area-inset-top);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-radius: 16px;
    }
    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #ffffff;
      color: #4338ca;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .verb-card {
      background: #ffffff;
      color: #1e1b4b;
      border-radius: 24px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      margin: 12px 0;
    }
    .badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .badge.review {
      background: #fee2e2;
      color: #b91c1c;
    }
    .verb-title {
      font-size: 32px;
      font-weight: 900;
      margin: 0;
      color: #1e1b4b;
    }
    .example-box {
      background: #f8fafc;
      border-left: 4px solid #7c3aed;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 14px;
      color: #334155;
      text-align: left;
      display: none;
      line-height: 1.4;
    }
    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    button.opt {
      background: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      border: none;
      border-radius: 18px;
      padding: 14px 10px;
      font-size: 14px;
      font-weight: 600;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      line-height: 1.3;
      word-break: break-word;
    }
    button.opt:active {
      transform: scale(0.96);
    }
    button.opt.correct {
      background: #10b981 !important;
      color: #ffffff !important;
    }
    button.opt.wrong {
      background: #ef4444 !important;
      color: #ffffff !important;
    }
    .next-btn {
      background: #facc15;
      color: #1e1b4b;
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 18px;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      display: none;
      margin-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="header">
      <span id="score">🎯 0 / 0</span>
      <span style="font-size: 12px; opacity: 0.85;">⚡ Offline Ready</span>
      <span id="streak">🔥 0 di fila</span>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="btn-all" onclick="setMode('all')">Tutti (3000+)</button>
      <button class="mode-btn" id="btn-mistakes" onclick="setMode('mistakes')">Da ripassare (<span id="mistakes-count">0</span>)</button>
    </div>
  </div>

  <div class="verb-card">
    <div class="badge" id="card-badge">Phrasal Verb</div>
    <h1 class="verb-title" id="verb-text">Caricamento...</h1>
    <div class="example-box" id="example-box"></div>
  </div>

  <div>
    <div class="grid-2x2" id="options-container"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Prossimo →</button>
  </div>

  <script>
    (function generateAppIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, '#4f46e5');
      grad.addColorStop(0.5, '#7c3aed');
      grad.addColorStop(1, '#db2777');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 180px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PV', 256, 235);
      ctx.fillStyle = '#facc15';
      ctx.font = '800 54px -apple-system, sans-serif';
      ctx.fillText('QUIZ', 256, 365);
      document.getElementById('apple-icon').href = canvas.toDataURL('image/png');
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    let allVerbs = [];
    let mistakes = JSON.parse(localStorage.getItem('pv_mistakes') || '[]');
    let mode = 'all';
    let currentVerb = null;
    let score = 0, total = 0, streak = 0;
    let answered = false;

    updateMistakesCounter();

    fetch('verbs.json')
      .then(res => res.json())
      .then(data => {
        allVerbs = data;
        nextQuestion();
      })
      .catch(() => {
        document.getElementById('verb-text').innerText = "Errore caricamento";
      });

    function saveMistakes() {
      localStorage.setItem('pv_mistakes', JSON.stringify(mistakes));
      updateMistakesCounter();
    }

    function updateMistakesCounter() {
      document.getElementById('mistakes-count').innerText = mistakes.length;
    }

    function setMode(newMode) {
      if (newMode === 'mistakes' && mistakes.length === 0) {
        alert("Non hai ancora errori da ripassare!");
        return;
      }
      mode = newMode;
      document.getElementById('btn-all').classList.toggle('active', mode === 'all');
      document.getElementById('btn-mistakes').classList.toggle('active', mode === 'mistakes');
      nextQuestion();
    }

    function nextQuestion() {
      if (mode === 'mistakes' && mistakes.length === 0) {
        alert("Complimenti! Hai ripassato tutti gli errori!");
        setMode('all');
        return;
      }

      answered = false;
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('example-box').style.display = 'none';
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const badge = document.getElementById('card-badge');
      if (mode === 'mistakes') {
        badge.innerText = "Ripasso Errore";
        badge.classList.add('review');
      } else {
        badge.innerText = "Phrasal Verb";
        badge.classList.remove('review');
      }

      const pool = mode === 'mistakes' ? mistakes : allVerbs;
      currentVerb = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('verb-text').innerText = currentVerb.verb;

      let choices = [currentVerb];
      while (choices.length < 4) {
        let rand = allVerbs[Math.floor(Math.random() * allVerbs.length)];
        if (!choices.some(c => c.meaning.toLowerCase() === rand.meaning.toLowerCase())) {
          choices.push(rand);
        }
      }

      choices.sort(() => Math.random() - 0.5);

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerText = choice.meaning;
        btn.onclick = () => checkAnswer(btn, choice);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedBtn, choice) {
      if (answered) return;
      answered = true;
      total++;

      const isCorrect = choice.meaning === currentVerb.meaning;

      if (isCorrect) {
        selectedBtn.classList.add('correct');
        score++;
        streak++;
        const idx = mistakes.findIndex(m => m.verb === currentVerb.verb && m.meaning === currentVerb.meaning);
        if (idx !== -1) {
          mistakes.splice(idx, 1);
          saveMistakes();
        }
      } else {
        selectedBtn.classList.add('wrong');
        streak = 0;
        if (!mistakes.some(m => m.verb === currentVerb.verb && m.meaning === currentVerb.meaning)) {
          mistakes.push(currentVerb);
          saveMistakes();
        }
        Array.from(document.getElementById('options-container').children).forEach(b => {
          if (b.innerText === currentVerb.meaning) {
            b.classList.add('correct');
          }
        });
      }

      document.getElementById('score').innerText = `🎯 ${score} / ${total}`;
      document.getElementById('streak').innerText = `🔥 ${streak} di fila`;

      if (currentVerb.example) {
        const exBox = document.getElementById('example-box');
        exBox.innerHTML = `<strong>Esempio:</strong><br><em>"${currentVerb.example}"</em>`;
        exBox.style.display = 'block';
      }

      document.getElementById('next-btn').style.display = 'block';
    }
